name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS arm64
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const tag = process.env.RELEASE_TAG;
          const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.exec(tag);
          if (!match) {
            throw new Error(`Release tag must use v<semver>, received: ${tag}`);
          }

          const expected = tag.slice(1);
          const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const tauriVersion = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargoManifest = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargoManifest.match(/^version\s*=\s*"([^"]+)"/m)?.[1];

          const versions = {
            'package.json': packageVersion,
            'src-tauri/tauri.conf.json': tauriVersion,
            'src-tauri/Cargo.toml': cargoVersion,
          };
          const mismatches = Object.entries(versions).filter(([, version]) => version !== expected);
          if (mismatches.length > 0) {
            const details = mismatches.map(([file, version]) => `${file}: ${version ?? '<missing>'}`).join(', ');
            throw new Error(`Tag ${tag} expects version ${expected}; mismatches: ${details}`);
          }

          console.log(`Validated release version ${expected} in all manifests.`);
          NODE

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked --target aarch64-apple-darwin

      - name: Build app and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CleanDisk ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadPlainBinary: false
          releaseAssetNamePattern: "[name]_[version]_[arch][ext]"
          args: --target aarch64-apple-darwin --bundles app
